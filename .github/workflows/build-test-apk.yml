name: Build EXP Mango Debug APK

on:
  push:
    branches:
      - 'exp-mango-core-implementation-*'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & Verify EXP Mango APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          if [ -f "scripts/audit-offline.sh" ]; then
            chmod +x scripts/audit-offline.sh
          fi

      - name: Run Offline Audit
        run: |
          if [ -f "scripts/audit-offline.sh" ]; then
            ./scripts/audit-offline.sh
          fi

      - name: Compile and Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Validate Generated APK
        run: |
          APK_FILE=$(find android/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No debug APK found in android/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          ls -lh "$APK_FILE"
          cp "$APK_FILE" expmango-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: exp-mango-debug-apk
          path: expmango-debug.apk
          if-no-files-found: error
          retention-days: 7
