name: Liquid Lab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare release asset
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk mangoloads.liquid.com.apk
          NOW="$(TZ=Asia/Kolkata date +'%Y.%m.%d.%H%M%S')"
          echo "RELEASE_TAG=liquid-$NOW-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Liquid Lab $NOW" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: mangoloads-liquid-lab
          path: mangoloads.liquid.com.apk
          if-no-files-found: error

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: true
          generate_release_notes: false
          files: mangoloads.liquid.com.apk
          body: |
            Liquid Lab experimental build.
            Package: mangoloads.liquid.com
            APK: mangoloads.liquid.com.apk
            Optical test: QWEA0 View-system Liquid Glass
            IME test: Android native cross-window blur
            This is an experimental pre-release for physical-device testing.
